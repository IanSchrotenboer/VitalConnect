name: Android-app bouwen

# Bij elke update (elke push naar main) een nieuwe APK, ook als alleen de backend of documentatie wijzigt.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK bouwen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Debug-APK bouwen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # Compileerfouten als annotatie, zodat ze zonder logbestanden zichtbaar zijn
      - name: Fouten samenvatten
        if: failure()
        run: |
          msg=$( (grep -E '^e: ' build.log; grep -A12 'What went wrong' build.log) | head -60 \
                 | sed -e 's/%/%25/g' -e 's#file:///home/runner/work/VitalConnect/VitalConnect/##' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build mislukt::${msg}"

      - name: Naam van het artefact
        if: success()
        id: meta
        run: |
          version=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=VitalConnect-${version}-build${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: ${{ steps.meta.outputs.name }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
