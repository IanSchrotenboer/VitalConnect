<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vital Connect</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'>  <rect width='108' height='108' rx='24' fill='%23123430'/>  <g transform='translate(54 54) scale(0.86) translate(-54 -54)' stroke='%23123430' stroke-width='2.6' stroke-linejoin='round' paint-order='stroke'>    <circle cx='55' cy='29.5' r='7.2' fill='%23DDB15A' stroke='none'/>    <path d='M25 41.5 C38 37.5 50 43.5 54 54 C57 62.5 55 72 50.5 80.5 C47.5 70.5 43 60.5 37 52.5 C33 47 29.5 43.5 25 41.5 Z' fill='%23F5935A'/>    <path d='M84.5 31.5 C70.5 33.5 60 43.5 57 56 C55 66 51.5 74.5 43.5 82.5 C58.5 78 66.5 67 71.5 55.5 C75.5 46.5 79 37.5 84.5 31.5 Z' fill='%234CC3B3'/>    <path d='M83 51.5 C81 66.5 70.5 80 50 82.5 C56.5 76 61 70 65.5 63.5 C70.5 56.5 76 53 83 51.5 Z' fill='%238C97F2'/>  </g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE calm and encouraging: rust in de basis, warmte in de doelen
   IDEA the Android app itself: a deep-pine watch dial over soft mist, three tabs
   PICTURE the dial with daily rings and one motivating line, then clear metric tiles
   COLOUR pine #123430 dial, sage #DCE6E1 ground, white tiles without border, apricot/rose/indigo/sea/ochre per category, green for goals met
   TYPE Figtree 700 for figures with tabular numbers, Figtree for text
   LAYOUT phone column up to 560px centred; dial on top, tiles 2-up, tab bar at the bottom */
:root{color-scheme:light dark;
--bg:light-dark(#dce6e1,#000000);--card:light-dark(#fff,#1d2321);--ink:light-dark(#0f1e1b,#e9f1ee);--mut:light-dark(#52615c,#9db0aa);--line:light-dark(#ccd7d2,#333b38);--outline:light-dark(#6e7f79,#63776f);
--pri:light-dark(#1c4d46,#7fd1c1);--onpri:light-dark(#fff,#0c1614);
--dial:#123430;--dink:#f3f7f5;--dmut:#a9bdb7;
--act:light-dark(#d86f31,#f5935a);--hart:light-dark(#d04e6a,#ec7290);--slaap:light-dark(#5865d6,#8c97f2);--herst:light-dark(#2f9c8f,#4cc3b3);--lich:light-dark(#ad7e24,#ddb15a);
--good:light-dark(#1e7f5c,#4cc79a);--src-hc:light-dark(#2f7d6e,#3a9483);--src-gh:light-dark(#3f7f4a,#4e9659);--src-gm:light-dark(#2b5fa8,#3b72c4);--bad:light-dark(#b4462b,#f07d5f);
--dact:#f5935a;--dhart:#ec7290;--dslaap:#8c97f2;--dherst:#4cc3b3;--dlich:#ddb15a;--dgood:#4cc79a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));position:relative}
h1,h2,h3{margin:0;line-height:1.1;letter-spacing:-.02em}
h1{font-size:30px;font-weight:700}h2{font-size:20px;font-weight:600}h3{font-size:16px;font-weight:600}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--act);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:-.02em}
.mut{color:var(--mut)}
.pad{padding:0 16px}
/* wijzerplaat */
.dial{background:var(--dial);color:var(--dink);border-radius:0 0 28px 28px;padding:max(16px,env(safe-area-inset-top,0px)) 12px 22px 20px}
.dtop{display:flex;align-items:flex-start;gap:4px}
.dtop .t{flex:1;min-width:0}.fit{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fit.two{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.fit.two .gn{display:block}.fit.three{-webkit-line-clamp:3}.dtop small{color:var(--dmut);font-size:14px}
.ib{width:44px;height:44px;border:0;border-radius:22px;background:transparent;display:grid;place-items:center;color:inherit}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:color-mix(in srgb,currentColor 10%,transparent)}
.ib.spin svg{animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.dmid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;margin:16px 8px 0 0}
.rsvg{width:100%;height:auto;display:block}
.rt{fill:none;stroke-width:13;stroke-opacity:.22}.rp{fill:none;stroke-width:13;stroke-linecap:round;transition:stroke-dasharray .9s cubic-bezier(.3,.7,.2,1)}
.rsvg text{fill:var(--dink);font:700 22px Figtree,sans-serif;text-anchor:middle}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.leg b{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--dmut)}
.leg span{font-size:22px}.leg small{color:var(--dmut);font-size:14px;font-weight:400}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.mot{margin:16px 8px 0 0;padding:10px 14px;border-radius:14px;background:rgba(243,247,245,.08);font-weight:600;font-size:15px}
.mot.ok{color:var(--dgood)}
.upd{margin:12px 0 0;color:var(--dmut);font-size:13px;transition:color .3s}.upd.ok{color:var(--dgood)}
.ib.done{color:var(--dgood)}.ib.done svg{animation:pop .45s cubic-bezier(.34,1.8,.64,1)}@keyframes pop{from{transform:scale(.6)}}
.dial.busy .rp{animation:rpulse .65s ease-in-out infinite alternate}@keyframes rpulse{to{opacity:.45}}
/* Beginscherm (Dagringen): de app laadt erachter */
#splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:none}
#splash.out{animation:spOut .35s cubic-bezier(.4,0,1,1) forwards}@keyframes spOut{to{opacity:0;transform:scale(1.05)}}
#splash .rg{position:relative;width:200px;height:200px}#splash .rg>*{position:absolute;inset:0;will-change:transform,opacity}
#splash .tr{fill:none;stroke-width:7;stroke:color-mix(in srgb,var(--ink) 7%,transparent)}
#splash .ar{fill:none;stroke-width:7;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:100px 100px;animation:spDraw .9s cubic-bezier(.4,0,.2,1) forwards}
#splash .a1{stroke:var(--act);animation-delay:.15s}#splash .a2{stroke:var(--herst);animation-delay:.3s}#splash .a3{stroke:var(--slaap);animation-delay:.45s}
#splash .s1{animation:spSpin 2.6s linear infinite}#splash .s2{animation:spSpin 3.4s linear infinite}#splash .s3{animation:spSpin 4.2s linear infinite}
#splash .lm{display:grid;place-items:center}#splash .lm svg{width:76px;height:76px;animation:spMark .5s cubic-bezier(.4,0,.2,1) both}
#splash .lm path{stroke:var(--bg);stroke-width:2.6;stroke-linejoin:round;paint-order:stroke}
#splash b{font-size:20px;font-weight:600;color:var(--ink);opacity:0;animation:spWord .4s ease-out .25s forwards}
@keyframes spDraw{to{stroke-dashoffset:30}}@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spMark{from{opacity:0;transform:scale(.85)}}@keyframes spWord{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash *{animation-duration:1ms!important;animation-delay:0s!important;animation-iteration-count:1!important}.dial.busy .rp,.ib.done svg{animation:none}}
.demo{color:var(--dmut);font-size:13px;margin:4px 0 0}
/* kaarten */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card{border-color:transparent}
.tap{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tap:hover{border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 12px;padding:0 4px}.sh h2{flex:1}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:0;border-radius:22px;background:transparent;color:var(--pri);font-weight:600}
.lnk svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.uk summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600;font-size:15px;color:var(--pri);border-radius:12px}
.uk summary::-webkit-details-marker{display:none}.uk summary::after{content:'';width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-3px) rotate(45deg);transition:transform .2s;margin-right:6px}
.uk[open] summary::after{transform:translateY(2px) rotate(-135deg)}.uk[open]>:not(summary){animation:ukIn .2s ease-out}.uk>*+*{margin-top:8px!important}.uk{display:flex;flex-direction:column;gap:8px}.uk p{margin:0 0 8px}
@keyframes ukIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.uk summary::after{transition:none}.uk[open]>:not(summary){animation:none}}
.wk{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}.wkh{display:flex;align-items:center;gap:10px}.wkt{flex:1;min-width:0;display:flex;flex-direction:column}
.wkt b{font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wkh>b{font-size:15px;color:var(--ink)}.wkf{font-size:13px;color:var(--ink)}
.wkd{font-size:17px;margin:12px 4px 0}.wbars{display:flex;gap:6px;align-items:flex-end;height:72px}.wbars span{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;justify-content:flex-end;height:100%}
.wbars i{display:block;width:100%;border-radius:4px;background:var(--pri)}.wbars small{font-size:11px;color:var(--mut)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.wf .fld{flex-direction:column;align-items:stretch;gap:4px}.wf .fld span{font-size:13px;color:var(--mut)}.wf .fld input,.wf textarea{width:100%;box-sizing:border-box;text-align:left}.wf textarea{min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px;font:inherit;color:var(--ink)}
.tile.herst{grid-column:1/-1}.herst{gap:10px}.hct{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%}.hct>span:first-child{display:flex;flex-direction:column;gap:4px}
.hl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;color:var(--ink)}.hs{font-size:44px;font-weight:700;line-height:1;color:var(--ink)}.hadv{font-size:15px;color:var(--ink);text-align:left}
.hf{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px solid var(--line);width:100%;text-align:left}.hft{display:flex;justify-content:space-between;gap:8px;font-size:15px;color:var(--ink)}
.hb{position:relative;display:block;height:10px;border-radius:5px;background:var(--bg);margin:3px 0}.hbn{position:absolute;top:0;bottom:0;border-radius:5px;background:color-mix(in srgb,var(--herst) 45%,transparent)}
.hbv{position:absolute;top:-3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--ink);border:2px solid var(--card)}.hbv.uit{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-flow:row dense;gap:12px}
.tile.l{grid-column:span 2}
.tn{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv{display:flex;align-items:baseline;gap:4px}.tv .num{font-size:28px;line-height:1.1}.tile.l .tv .num{font-size:36px}.tv small{color:var(--mut);font-size:14px}
.bar{height:8px;border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;border-radius:4px}
.gl{font-size:13px;font-weight:500;color:var(--mut)}.gl.ok{color:var(--good)}
.spark{width:100%;height:34px;display:block}.tile.l .spark{height:52px}
.tm{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:500;color:var(--mut)}
.tm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up{color:var(--good)!important}.dn{color:var(--bad)!important}
/* koppen */
.ph{padding:20px 20px 4px}.ph p{margin:4px 0 0;color:var(--mut);font-size:15px}
.cat{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}.cat h2{font-size:18px}
.stack{display:grid;gap:12px}
.st{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.st div small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.st div b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{display:flex;align-items:baseline;gap:4px}.big .num{font-size:28px}.big small{color:var(--mut);font-size:14px}.big em{margin-left:auto;font-style:normal;color:var(--mut);font-size:13px}
.hero{background:var(--pri);color:var(--onpri);border:0}
.hero .st div small{color:color-mix(in srgb,var(--onpri) 75%,transparent)}
.chev{width:20px;height:20px;fill:none;stroke:var(--mut);stroke-width:2;stroke-linecap:round;margin-left:auto}
/* slaap */
.night{background:var(--dial);color:var(--dink);border:0}
.night .mut{color:var(--dmut)}
.night .num.xl{font-size:44px;line-height:1}
.tip{background:color-mix(in srgb,var(--slaap) 12%,transparent);border-radius:16px;padding:16px;font-size:15px}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trio .num{font-size:22px}
/* grafiek */
.fig{position:relative;height:240px;touch-action:pan-y}.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font:12px Figtree,sans-serif;fill:var(--mut);paint-order:stroke;stroke:var(--card);stroke-width:4px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 16px}
.pill{flex:none;min-height:48px;padding:0 16px;border-radius:24px;border:1px solid var(--outline);background:transparent;font-weight:600;font-size:15px}
.pill[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.back{display:flex;align-items:center;gap:4px;padding:8px 16px 0 4px}
/* knoppen en bronnen */
.btn{min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:transparent;font-weight:600}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn:disabled{opacity:.6}
.row{display:flex;gap:8px;flex-wrap:wrap}
.src{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700}
.ok{color:var(--good)}
/* tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;font-size:13px;font-weight:500;color:var(--mut)}
.tabs button span{display:grid;place-items:center;width:64px;height:32px;border-radius:16px}
.tabs button[aria-current=page]{color:var(--pri)}.tabs button[aria-current=page] span{background:color-mix(in srgb,var(--pri) 12%,transparent)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* aanpassen */
.edit .er{display:flex;align-items:center;gap:10px}
.edit .er .t{flex:1}
.sw{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;margin:0;cursor:pointer;flex:none}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--pri)}.sw:checked::before{transform:translateX(20px)}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px}
.fld input{width:8em;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:16px;text-align:right}
.fld input.sw{width:48px;min-height:28px;height:28px;padding:0;border:0;border-radius:14px;background:var(--line)}.fld input.sw:checked{background:var(--pri)}
.ib:disabled{opacity:.3;cursor:default}
.note{color:var(--bad);font-size:14px;min-height:1.2em;margin:0 4px}
[hidden]{display:none!important}
@keyframes inr{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}@keyframes inl{from{transform:translateX(-24px);opacity:.4}to{transform:none;opacity:1}}
.in-r{animation:inr .22s ease-out}.in-l{animation:inl .22s ease-out}
@media(prefers-reduced-motion:reduce){.in-r,.in-l{animation:none}}
@media(max-width:380px){.dmid{grid-template-columns:120px minmax(0,1fr);gap:14px}.tv .num{font-size:24px}}
/* heel smal: buitenscherm van een klaptelefoon */
@media(max-width:339px){.grid{grid-template-columns:minmax(0,1fr)}.tile.l{grid-column:auto}.trio{grid-template-columns:minmax(0,1fr)}.dmid{grid-template-columns:108px minmax(0,1fr);gap:12px}}
/* breed: opengevouwen foldable of tablet; tabbladen aan de zijkant, meer kolommen */
@media(min-width:600px){
  .app{max-width:none;margin:0;padding:0 0 24px 88px}
  .app>section{max-width:1200px;margin:0 auto}
  #v-settings,#v-edit,#v-detail,#v-auth{max-width:640px}
  .tabs{top:0;right:auto;width:88px;border-top:0;border-right:1px solid var(--line);padding:max(16px,env(safe-area-inset-top,0px)) 0 0}
  .tabs div{grid-template-columns:88px;gap:12px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .app.auth{padding-left:0}
}
@media(min-width:840px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* inloggen en kennismaking */
.ah{background:var(--dial);color:var(--dink);border-radius:0 0 28px 28px;padding:max(40px,env(safe-area-inset-top,0px)) 24px 28px;display:grid;gap:8px}
.ah h1{font-size:34px}.ah p{margin:0;color:var(--dmut)}.ah small{color:var(--dmut);font-weight:500}
.btn.google{background:light-dark(#fff,#131314);color:light-dark(#1f1f1f,#e3e3e3);border-color:light-dark(#747775,#8e918f);border-radius:28px}
.btn.big{min-height:56px;width:100%;font-size:17px;display:flex;align-items:center;justify-content:center}
.ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;color:var(--mut);font-size:15px}.ul li{display:flex;gap:10px;align-items:center}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15px}.chk input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--pri);flex:none}
@media(prefers-reduced-motion:reduce){.rp,.sw::before{transition:none}.ib.spin svg{animation:none}}
</style>
</head>
<body>
<div id="splash" aria-hidden="true"><div class="rg"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="80"/><circle class="tr" cx="100" cy="100" r="68"/><circle class="tr" cx="100" cy="100" r="56"/></svg><svg class="s1" viewBox="0 0 200 200"><circle class="ar a1" cx="100" cy="100" r="80" pathLength="100"/></svg><svg class="s2" viewBox="0 0 200 200"><circle class="ar a2" cx="100" cy="100" r="68" pathLength="100"/></svg><svg class="s3" viewBox="0 0 200 200"><circle class="ar a3" cx="100" cy="100" r="56" pathLength="100"/></svg><div class="lm"><svg viewBox="18 16 74 74"><circle cx="55" cy="29.5" r="7.2" fill="#DDB15A"/><path d="M25 41.5 C38 37.5 50 43.5 54 54 C57 62.5 55 72 50.5 80.5 C47.5 70.5 43 60.5 37 52.5 C33 47 29.5 43.5 25 41.5 Z" fill="#F5935A"/><path d="M84.5 31.5 C70.5 33.5 60 43.5 57 56 C55 66 51.5 74.5 43.5 82.5 C58.5 78 66.5 67 71.5 55.5 C75.5 46.5 79 37.5 84.5 31.5 Z" fill="#4CC3B3"/><path d="M83 51.5 C81 66.5 70.5 80 50 82.5 C56.5 76 61 70 65.5 63.5 C70.5 56.5 76 53 83 51.5 Z" fill="#8C97F2"/></svg></div></div><b>Vital Connect</b></div>
<div class="app">
  <section id="v-today"></section>
  <section id="v-health" hidden></section>
  <section id="v-sleep" hidden></section>
  <section id="v-training" hidden></section>
  <section id="v-detail" hidden></section>
  <section id="v-settings" hidden></section>
  <section id="v-edit" hidden></section>
  <section id="v-auth" hidden></section>

<script>
{
const $=q=>document.querySelector(q);
const N=400,DAY=864e5,NOW=new Date();
const NL='nl-NL';
const CAT={act:'Activiteit',hart:'Hart',slaap:'Slaap',herst:'Herstel',lich:'Lichaam'};
const M=[
{id:'steps',n:'Stappen',u:'stappen',cat:'act',d:0,b:9200,v:3000,t:2,g:10000,agg:'sum'},
{id:'active',n:'Actieve minuten',u:'min',cat:'act',d:0,b:46,v:20,t:.01,g:30,agg:'sum'},
{id:'kcal',n:'Actieve calorieën',u:'kcal',cat:'act',d:0,b:640,v:200,t:.1,g:600,agg:'sum'},
{id:'dist',n:'Afstand',u:'km',cat:'act',d:1,b:7.4,v:2.6,t:.002,g:8,agg:'sum'},
{id:'floors',n:'Verdiepingen',u:'',cat:'act',d:0,b:9,v:4,t:0,g:10,agg:'sum'},
{id:'rhr',n:'Rusthartslag',u:'bpm',cat:'hart',d:0,b:53,v:2.2,t:-.004,lo:1,agg:'avg'},
{id:'hrv',n:'HRV',u:'ms',cat:'hart',d:0,b:58,v:8,t:.01,agg:'avg'},
{id:'spo2',n:'Zuurstof (SpO₂)',u:'%',cat:'hart',d:0,b:96.4,v:.9,t:0,max:100,agg:'avg'},
{id:'sleep',n:'Slaapduur',u:'',cat:'slaap',d:2,b:7.2,v:.7,t:.0005,g:8,agg:'sum'},
{id:'sscore',n:'Slaapscore',u:'',cat:'slaap',d:0,b:78,v:8,t:.01,max:100,agg:'last'},

{id:'energy',n:'Energieniveau',u:'%',cat:'herst',d:0,b:64,v:16,t:.015,min:5,max:100,agg:'last'},

];
const MI=Object.fromEntries(M.map(m=>[m.id,m]));
const SRC={steps:'Garmin Connect',active:'Garmin Connect',kcal:'Garmin Connect',dist:'Garmin Connect',floors:'Garmin Connect',rhr:'Garmin Connect',hrv:'Garmin Connect',spo2:'Google Health',sleep:'Garmin Connect',sscore:'Garmin Connect',resp:'Google Health',stress:'Garmin Connect',energy:'Garmin Connect',recov:'Garmin Connect',vo2:'Garmin Connect',weight:'Health Connect'};

const hash=k=>{let h=7;for(const c of k)h=(h*31+c.charCodeAt(0))%2147483647;return h||1};
const cache={};
const series=id=>{if(cache[id])return cache[id];const m=MI[id];let s=hash(id);const r=()=>(s=s*16807%2147483647)/2147483647;let w=0;const a=[];
for(let i=0;i<N;i++){const n=(r()+r()+r()-1.5)/.75;w=.5*w+.5*n;const wk=Math.sin(i*2*Math.PI/7)*.3;let x=(m.b+m.t*(i-N+1))+m.v*(w+wk);x=Math.max(m.min??0,Math.min(m.max??Infinity,x));const f=10**m.d;a.push(Math.round(x*f)/f)}return cache[id]=a};
const dd=i=>new Date(NOW.getTime()-(N-1-i)*DAY);

const KEY='vitalconnect.preview.v1';
const SPORT_KEYS=new Set(['running','walking','hiking','cycling','swimming','strength','hiit','yoga','rowing','elliptical','team','racket','dance','martial','winter','other']);
const fresh=()=>({wk:[],order:['steps','sleep','rhr','active','hrv','energy','kcal','weight'],size:{steps:'l',sleep:'l'},goal:{},rings:['steps','active','sleep'],conn:{hc:true,google:true,garmin:false},theme:'system',onb:'login',sync:60,lay:{greetName:true,motivation:true,healthTotals:true,healthHidden:[],sleepTiles:['hrv','rhr','resp'],sleepAdvice:true,herstel:true},nGoals:true,nStatus:false,prof:{name:'Sam de Vries',birth:'1991-04-18',sex:null,h:null,w:null}});
// Opgeslagen staat wordt veld voor veld gecontroleerd: kapotte, oude of vreemde waarden vallen terug op de standaard.
function clean(raw){const d=fresh(),o=raw&&typeof raw==='object'&&!Array.isArray(raw)?raw:{};
const ids=a=>Array.isArray(a)?[...new Set(a.filter(x=>x in MI))]:null,obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
const order=ids(o.order);if(order&&order.length)d.order=order;
const rings=ids(o.rings);if(rings&&rings.length===3)d.rings=rings;
d.size=Object.fromEntries(Object.entries(obj(o.size)).filter(([k,v])=>k in MI&&['s','m','l'].includes(v)));if(!o.size)d.size=fresh().size;
d.goal=Object.fromEntries(Object.entries(obj(o.goal)).filter(([k,v])=>k in MI&&Number.isFinite(v)&&v>0));
for(const k of Object.keys(d.conn))if(typeof obj(o.conn)[k]==='boolean')d.conn[k]=o.conn[k];
if(['system','light','dark'].includes(o.theme))d.theme=o.theme;
if(o.onb===null||['login','consent','import','profile'].includes(o.onb))d.onb=o.onb;
if([15,30,60,180,360,0].includes(o.sync))d.sync=o.sync;
for(const k of ['nGoals','nStatus'])if(typeof o[k]==='boolean')d[k]=o[k];
const l=obj(o.lay);for(const k of ['greetName','motivation','healthTotals','sleepAdvice','herstel'])if(typeof l[k]==='boolean')d.lay[k]=l[k];
const hid=ids(l.healthHidden);if(hid)d.lay.healthHidden=hid;const st=ids(l.sleepTiles);if(st&&st.length)d.lay.sleepTiles=st;
const pr=obj(o.prof),txt=(x,n)=>typeof x==='string'?x.slice(0,n):null,num=(x,lo,hi)=>Number.isFinite(x)&&x>=lo&&x<=hi?x:null;
d.prof={name:txt(pr.name,60)??d.prof.name,birth:/^\d{4}-\d{2}-\d{2}$/.test(pr.birth)&&!isNaN(new Date(pr.birth))?pr.birth:null,sex:['female','male','other'].includes(pr.sex)?pr.sex:null,h:num(pr.h,50,260),w:num(pr.w,20,400)};
const wk=Array.isArray(o.wk)?o.wk:[];d.wk=wk.filter(w=>w&&typeof w==='object'&&typeof w.id==='string'&&SPORT_KEYS.has(w.sport)&&['manual','file'].includes(w.source)
  &&/^\d{4}-\d{2}-\d{2}$/.test(w.day)&&Number.isFinite(w.start)&&Number.isFinite(w.dur)&&w.dur>=60&&w.dur<=86400).slice(0,500).map(w=>({id:w.id.slice(0,120),source:w.source,sport:w.sport,
  title:typeof w.title==='string'?w.title.slice(0,80):null,day:w.day,start:w.start,dur:w.dur,dist:num(w.dist,0,1e6),kcal:num(w.kcal,0,2e4),avg:num(w.avg,25,250),max:num(w.max,25,250),asc:num(w.asc,0,2e4),
  notes:typeof w.notes==='string'?w.notes.slice(0,1000):null,origin:typeof w.origin==='string'?w.origin.slice(0,40):null}));
return d}
let S;try{S=clean(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const applyTheme=()=>{const r=document.documentElement;if(S.theme==='light'||S.theme==='dark')r.dataset.theme=S.theme;else delete r.dataset.theme};applyTheme();
const goal=id=>id in S.goal?S.goal[id]:MI[id].g;
const today=id=>series(id)[N-1];
const col=(id,dial)=>`var(--${dial?'d':''}${MI[id].cat})`;
// Ringen krijgen een kleur per positie, zodat twee doelen uit dezelfde categorie niet gelijk kleuren
const RING=['var(--dact)','var(--dherst)','var(--dslaap)'];
const nl=(v,d=0)=>v.toLocaleString(NL,{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtH=v=>{let h=Math.floor(v),m=Math.round((v-h)*60);if(m===60){h++;m=0}return`${h}u ${String(m).padStart(2,'0')}m`};
const fmt=(id,v)=>v==null?'–':id==='sleep'?fmtH(v):nl(v,MI[id].d);
const unit=id=>id==='sleep'?'':MI[id].u;
const compact=v=>Math.abs(v)>=1e6?nl(v/1e6,1)+' mln':Math.abs(v)>=1e4?nl(v/1e3,0)+'k':nl(v,0);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const dlt=id=>{const a=series(id),v=a[N-1],p=mean(a.slice(N-8,N-1));return p?(v-p)/p*100:0};
const deltaHtml=(id,short)=>{const pc=dlt(id),m=MI[id];if(Math.abs(pc)<1)return`<span>${short?'gelijk':'gelijk aan je week'}</span>`;const good=m.lo?pc<0:pc>0;return`<span class="${good?'up':'dn'}" aria-label="${nl(Math.abs(pc))} procent ${pc>0?'hoger':'lager'} dan vorige week">${pc>0?'▲':'▼'} ${nl(Math.abs(pc))}%${short?'':' vs week'}</span>`};
const spark=(id,days)=>{const a=series(id).slice(N-days),lo=Math.min(...a),hi=Math.max(...a),rg=hi-lo||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*100).toFixed(1)},${(28-(v-lo)/rg*24).toFixed(1)}`);const last=pts[pts.length-1].split(',');
return`<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" style="stroke:${col(id)}" stroke-width="2.2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
const I={
check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
sync:'<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>',
person:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 20a8 8 0 0 1 16 0"/></svg>',
back:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
sliders:'<svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M15 4v4M4 12h3M11 12h9M9 10v4M4 18h11M19 18h1M17 16v4"/></svg>',
chev:'<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>'};

let tab='today',detail=null,period=30,sel=null,settings=false,ptab='profile',editing=null,busy=null,syncedAt=new Date(NOW.getTime()-6e5),refreshing=null;
const views=['today','health','sleep','training','detail','settings','edit','auth'];
function show(){const v=S.onb?'auth':editing?'edit':detail?'detail':settings?'settings':tab;views.forEach(n=>$('#v-'+n).hidden=n!==v);$('#tabs').hidden=v!==tab;$('.app').classList.toggle('auth',v==='auth');
document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));window.scrollTo(0,0)}

// ---------- Vandaag ----------
function renderToday(){
  const h=NOW.getHours(),first=(S.prof.name||'').trim().split(/\s+/)[0],greet=(h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond')+(first&&S.lay.greetName?',<span class="gn"> '+esc(first)+'</span>':'');
  const date=NOW.toLocaleDateString(NL,{weekday:'long',day:'numeric',month:'long'});
  const rings=S.rings.filter(id=>goal(id)&&!MI[id].lo).slice(0,3),R=[68,50,32];
  const fr=rings.map(id=>today(id)/goal(id)),avg=Math.round(mean(fr.map(f=>Math.min(f,1)))*100);
  const open=rings.map((id,i)=>[id,fr[i]]).filter(x=>x[1]<1).sort((a,b)=>b[1]-a[1])[0];
  const mot=open?`Nog ${fmt(open[0],goal(open[0])-today(open[0]))} ${unit(open[0])} tot je doel voor ${MI[open[0]].n.toLowerCase()}.`.replace('  ',' '):'Alle dagdoelen gehaald. Mooi werk!';
  // Een metric in de ringen staat niet ook als tegel
  const tiles=S.order.filter(id=>!rings.includes(id));
  const rows=[];let pair=[];for(const id of tiles){if(S.size[id]==='l'){if(pair.length){rows.push(pair);pair=[]}rows.push([id])}else{pair.push(id);if(pair.length===2){rows.push(pair);pair=[]}}}if(pair.length)rows.push(pair);
  $('#v-today').innerHTML=`<header class="dial">
    <div class="dtop"><div class="t"><small>${date.charAt(0).toUpperCase()+date.slice(1)}</small><h1 class="fit">${greet}</h1></div>
    <button class="ib${refreshing==='done'?' done':''}" id="syncBtn" data-act="sync" aria-label="${refreshing==='done'?'Bijgewerkt':'Bijwerken'}">${refreshing==='done'?I.check:I.sync}</button><button class="ib" data-act="settings" aria-label="Profiel en koppelingen">${I.person}</button></div>
    ${rings.length?`<div class="dmid"><svg class="rsvg" viewBox="0 0 150 150" role="img" aria-label="Dagdoelen ${avg}% gehaald">${rings.map((id,i)=>{const r=R[i],c=2*Math.PI*r;return`<circle cx="75" cy="75" r="${r}" class="rt" style="stroke:${RING[i]}"/><circle cx="75" cy="75" r="${r}" class="rp" style="stroke:${RING[i]}" stroke-dasharray="0 ${c}" data-d="${c*Math.min(fr[i],1)} ${c}" transform="rotate(-90 75 75)"/>`}).join('')}<text x="75" y="83">${avg}%</text></svg>
    <ul class="leg">${rings.map((id,i)=>`<li><b><i class="dot" style="background:${RING[i]}"></i>${MI[id].n}</b><span class="num">${fmt(id,today(id))}</span> <small>/ ${fmt(id,goal(id))}</small></li>`).join('')}</ul></div>
    ${S.lay.motivation?`<div class="mot ${open?'':'ok'}">${mot}</div>`:''}`:`<p class="mot">Kies tot drie dagdoelen via Aanpassen om hier je voortgang te zien.</p>`}
    <p class="upd${refreshing==='done'?' ok':''}" aria-live="polite">Bijgewerkt om ${syncedAt.toLocaleTimeString(NL,{hour:'2-digit',minute:'2-digit'})}</p>
    <p class="demo">Preview met voorbeelddata</p></header>
  <div class="pad"><div class="sh"><h2>Jouw metrics</h2><button class="lnk" data-act="edit">${I.sliders}Aanpassen</button></div>
  <div class="grid">${S.lay.herstel?herstelTile():''}${rows.map(r=>r.map(tile).join('')).join('')}</div></div>`;
  fitHeads();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#v-today .rp').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.d))));
}
function tile(id){const m=MI[id],v=today(id),g=goal(id),wide=S.size[id]==='l';const f=g?(m.lo?g/v:v/g):null;
  return`<button class="card tap tile ${wide?'l':''}" data-open="${id}"><span class="tn"><i class="dot" style="background:${col(id)}"></i>${m.n}</span>
  <span class="tv"><span class="num">${fmt(id,v)}</span>${unit(id)?`<small>${unit(id)}</small>`:''}</span>
  ${f!=null?`<span class="bar" style="background:color-mix(in srgb,${col(id)} 18%,transparent)"><b style="width:${Math.min(f,1)*100}%;background:${f>=1?'var(--good)':col(id)}"></b></span><span class="gl ${f>=1?'ok':''}">${f>=1?'Doel gehaald':`${nl(f*100)}% van ${fmt(id,g)}`}</span>`:''}
  ${spark(id,wide?14:7)}<span class="tm"><span>${wide?SRC[id]:SRC[id].replace(' Connect','')}</span>${deltaHtml(id,!wide)}</span></button>`}

// ---------- Gezondheid ----------
function stats(id){const a=series(id),m=MI[id];return{last:a[N-1],avg:mean(a),avg30:mean(a.slice(N-30)),max:Math.max(...a),min:Math.min(...a),total:a.reduce((x,y)=>x+y,0)}}
function renderHealth(){
  const first=dd(0).toLocaleDateString(NL,{day:'numeric',month:'short',year:'numeric'});
  const s=stats('steps'),k=stats('dist'),sl=stats('sleep');
  $('#v-health').innerHTML=`<div class="ph" style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h1>Gezondheid</h1><p>Al je statistieken sinds ${first}</p></div><button class="lnk" data-edit="health">${I.sliders}Aanpassen</button></div>
  <div class="pad stack">${S.lay.healthTotals?`<div class="card hero"><small style="opacity:.8;font-weight:500">Tot nu toe</small><div class="st" style="grid-template-columns:repeat(3,minmax(0,1fr))">
  <div><small>Stappen</small><b>${compact(s.total)}</b></div><div><small>Kilometer</small><b>${compact(k.total)}</b></div><div><small>Gem. slaap</small><b>${fmtH(sl.avg)}</b></div></div></div>`:''}
  ${Object.keys(CAT).filter(c=>M.some(m=>m.cat===c&&!S.lay.healthHidden.includes(m.id))).map(c=>`<div class="cat"><i class="dot" style="background:var(--${c});width:10px;height:10px"></i><h2>${CAT[c]}</h2></div>
  <div class="stack hl">${M.filter(m=>m.cat===c&&!S.lay.healthHidden.includes(m.id)).map(m=>statCard(m.id)).join('')}</div>`).join('')}</div>`;
}
function statCard(id){const m=MI[id],s=stats(id),sum=m.agg==='sum'&&id!=='sleep',f=v=>fmt(id,v);
  return`<button class="card tap" data-open="${id}"><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="background:${col(id)}"></i><h3>${m.n}</h3>${I.chev}</span>
  <span class="big"><span class="num">${f(s.last)}</span>${unit(id)?`<small>${unit(id)}</small>`:''}<em>vandaag</em></span>
  <span class="st"><div><small>${sum?'Gem. per dag':'Gemiddeld'}</small><b>${f(s.avg)}</b></div><div><small>Laatste 30 d.</small><b>${f(s.avg30)}</b></div>
  <div><small>${m.lo?'Beste (laagste)':'Record'}</small><b style="color:${col(id)}">${f(m.lo?s.min:s.max)}</b></div>
  <div><small>${sum?'Totaal':m.lo?'Hoogste':'Laagste'}</small><b>${sum?compact(s.total):f(m.lo?s.max:s.min)}</b></div></span>
  <span class="gl">${N} dagen gemeten</span></button>`}

// ---------- Slaap ----------
let sleepSel=13;
function renderSleep(){
  const a=series('sleep'),g=goal('sleep')||8,nights=a.slice(N-14),last=a[N-1],f=last/g,wk=nights.slice(7),avg7=mean(wk),debt=wk.reduce((s,v)=>s+Math.max(g-v,0),0),score=series('sscore')[N-1];
  const diff=g-avg7,tip=diff>.5?`Je slaapt deze week gemiddeld ${fmtH(diff)} korter dan je doel. Een vaste bedtijd, ook in het weekend, helpt je ritme.`:diff>0?'Je zit dicht bij je slaapdoel. Nog een kwartier eerder naar bed en je haalt het.':'Je haalt je slaapdoel gemiddeld. Houd dit ritme vast.';
  const si=dd(N-14+sleepSel);
  const rt=S.lay.sleepTiles.filter(id=>MI[id]);
  $('#v-sleep').innerHTML=`<div class="ph" style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h1>Slaap</h1><p>Hoe goed je rust, en hoe je lichaam herstelt</p></div><button class="lnk" data-edit="sleep">${I.sliders}Aanpassen</button></div>
  <div class="pad stack"><button class="card tap night" data-open="sleep"><span class="mut" style="font-size:14px;font-weight:500">Afgelopen nacht</span>
  <span style="display:flex;align-items:flex-end;gap:12px"><span class="num xl">${fmtH(last)}</span><span style="margin-left:auto;text-align:right"><small class="mut" style="display:block;font-size:13px">Score</small><span class="num" style="font-size:28px;color:var(--dslaap)">${nl(score)}</span></span></span>
  <span class="bar" style="height:10px;background:rgba(140,151,242,.2)"><b style="width:${Math.min(f,1)*100}%;background:${f>=1?'var(--dgood)':'var(--dslaap)'}"></b></span>
  <span style="font-weight:600;font-size:15px;${f>=1?'color:var(--dgood)':''}">${f>=1?`Slaapdoel van ${fmtH(g)} gehaald`:`${nl(f*100)}% van je doel van ${fmtH(g)}`}</span></button>
  <div class="card"><h3>Laatste 14 nachten</h3><p class="mut" style="margin:0;font-size:15px">${si.toLocaleDateString(NL,{weekday:'long',day:'numeric',month:'short'})}: ${fmtH(nights[sleepSel])}</p>
  <div class="fig" id="sleepFig"><svg></svg></div>
  <div class="st" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Gem. 7 nachten</small><b>${fmtH(avg7)}</b></div><div><small>Tekort deze week</small><b class="${debt>2?'dn':''}">${fmtH(debt)}</b></div><div><small>Beste nacht</small><b style="color:var(--slaap)">${fmtH(Math.max(...nights))}</b></div></div></div>
  ${S.lay.sleepAdvice?`<div class="tip">${tip}</div>`:''}
  ${rt.length?`<div class="sh" style="margin-bottom:0"><h2>Herstel tijdens je slaap</h2></div>`:''}
  <div class="trio">${rt.map(id=>`<button class="card tap" data-open="${id}"><span class="gl">${MI[id].n}</span><span class="tv"><span class="num">${fmt(id,today(id))}</span><small>${MI[id].u}</small></span><span class="tm">${deltaHtml(id,true)}</span></button>`).join('')}</div></div>`;
  drawChart($('#sleepFig svg'),nights.map((v,i)=>({d:dd(N-14+i),v})),{bars:true,goal:g,color:'var(--slaap)',sel:sleepSel,axis:v=>Math.round(v)+'u',onSel:i=>{sleepSel=i;renderSleep()}});
}

function drawChart(s,pts,o){
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;const n=pts.length,vals=pts.map(p=>p.v);
    let lo=Math.min(...vals),hi=Math.max(...vals);if(o.goal){lo=Math.min(lo,o.goal);hi=Math.max(hi,o.goal)}
    if(o.bars){lo=0;hi*=1.08}else{const pd=(hi-lo)*.15||1;lo-=pd;hi+=pd}
    const L=W<400?40:48,R=8,T=10,B=24,iw=W-L-R,ih=H-T-B,bw=iw/n,y=v=>T+ih-(v-lo)/(hi-lo)*ih,x=i=>L+bw*(i+.5);
    let g='';for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>`;if(k%2===0)g+=`<text x="${L-6}" y="${yy+4}" text-anchor="end">${o.axis(v)}</text>`}
    const step=n<=7?1:n<=31?7:n<=92?30:91;
    for(let i=n-1;i>=0;i-=step){const lb=n<=14&&n>7?pts[i].d.toLocaleDateString(NL,{day:'numeric'}):n<=7?pts[i].d.toLocaleDateString(NL,{weekday:'short'}):pts[i].d.toLocaleDateString(NL,{day:'numeric',month:'short'});g+=`<text x="${Math.min(Math.max(x(i),L+12),W-R-14)}" y="${H-6}" text-anchor="middle">${lb}</text>`}
    if(o.bars){const w=Math.max(bw*.62,1.5);pts.forEach((p,i)=>{g+=`<rect x="${x(i)-w/2}" y="${y(p.v)}" width="${w}" height="${Math.max(y(lo)-y(p.v),1)}" rx="${Math.min(w/2,6)}" style="fill:${o.color}" opacity="${i===o.sel?1:.42}"/>`})}
    else{const ln=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');g+=`<path d="${ln}L${x(n-1)},${y(lo)}L${x(0)},${y(lo)}Z" style="fill:${o.color}" opacity=".14"/><path d="${ln}" fill="none" style="stroke:${o.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
      g+=`<line x1="${x(o.sel)}" x2="${x(o.sel)}" y1="${T}" y2="${T+ih}" stroke="var(--mut)" stroke-dasharray="3 3"/><circle cx="${x(o.sel)}" cy="${y(pts[o.sel].v)}" r="5.5" style="fill:${o.color}" stroke="var(--card)" stroke-width="2.5"/>`}
    if(o.goal&&o.goal>=lo&&o.goal<=hi)g+=`<line x1="${L}" x2="${W-R}" y1="${y(o.goal)}" y2="${y(o.goal)}" stroke="var(--ink)" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${W-R}" y="${y(o.goal)-6}" text-anchor="end" style="fill:var(--ink)">Doel</text>`;
    s.innerHTML=g;
    s.onpointerdown=s.onpointermove=e=>{if(e.type==='pointermove'&&!e.buttons&&e.pointerType!=='mouse')return;if(e.type==='pointermove'&&e.pointerType==='mouse'&&!e.buttons)return;const r=s.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.floor((e.clientX-r.left-L)/bw)));if(i!==o.sel)o.onSel(i)}};
  draw();const ro=new ResizeObserver(draw);ro.observe(s);
}

/* Herstel en fitheid: dezelfde berekening als de server (functie fitness, docs/berekeningen.md).
   HRV als ln(RMSSD), 7 dagen tegen je basislijn van de 60 dagen ervoor; normaal = basislijn ± 0,5 SD (Plews e.a.; AIS).
   Score: HRV 50%, rusthartslag 25%, slaap 25% (eigen weging). Max. hartslag 208 − 0,7 × leeftijd (Tanaka); VO2max ≈ factor × max ÷ rust (Uth). */
const sdev=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
function bandOf(a,t,log,lower){const f=log?Math.log:x=>x,u=log?Math.exp:x=>x,w=a.slice(t-6,t+1).map(f),b=a.slice(t-66,t-6).map(f);
  const mu=mean(b),sd=sdev(b),swc=.5*sd,v=mean(w),z=(v-mu)/sd,st=v<mu-swc?'laag':v>mu+swc?'hoog':'normaal';
  return{value:u(v),low:u(mu-swc),high:u(mu+swc),min:u(mu-2.5*sd),max:u(mu+2.5*sd),state:st,bad:lower?st==='hoog':st==='laag',points:Math.max(0,Math.min(100,Math.round(50+(lower?-25:25)*z)))}}
function herstel(){
  const t=N-1,hrv=bandOf(series('hrv'),t,true,false),rhr=bandOf(series('rhr'),t,false,true);
  const need=goal('sleep')||8,sl=series('sleep'),last=sl[t],wk=mean(sl.slice(t-6,t+1));
  const sleep={last,week:wk,need,bad:wk<.9*need,points:Math.round(100*Math.min(1,(.5*last+.5*wk)/need))};
  const score=Math.round(.5*hrv.points+.25*rhr.points+.25*sleep.points),uit=[hrv.bad,rhr.bad].filter(Boolean).length;
  const stand=uit===2||(uit===1&&sleep.bad)?2:uit===1||sleep.bad?1:0;
  const a=series('hrv'),trend=[];for(let i=t-29;i<=t;i++){const b=bandOf(a,i,true,false);trend.push({d:dd(i),v:b.value,lo:b.low,hi:b.high})}
  const birth=S.prof.birth?new Date(S.prof.birth):null,age=birth?Math.floor((NOW-birth)/31557600000):null,hrmax=age!=null?Math.round(208-.7*age):null;
  const pf=S.prof.sex==='male'?15.3:S.prof.sex==='female'?14.5:15;
  return{score,stand,hrv,rhr,sleep,trend,fit:{age,hrmax,pf,rhr7:rhr.value,vo2:today('vo2'),est:hrmax?pf*hrmax/rhr.value:null,
    zones:hrmax?[1,2,3,4,5].map(z=>[z,Math.round(hrmax*(.4+.1*z)),Math.round(hrmax*(.5+.1*z))]):[]}}}
const STAND=[['Goed hersteld','var(--good)','Je lichaam is hersteld. Ruimte voor een stevige training.'],
  ['Let op','var(--act)','Eén signaal wijkt af van je normaal. Train gerust, maar luister naar je lichaam.'],
  ['Rustig aan','var(--slaap)','Meerdere signalen wijzen op vermoeidheid. Kies vandaag voor rust of een rustige training.']];
const stateTxt=(b,lower)=>b.state==='normaal'?'Binnen je normale bereik.':b.state==='hoog'?(lower?'Hoger dan normaal: vaak een teken van vermoeidheid of een opkomende verkoudheid.':'Hoger dan normaal: goed hersteld.'):(lower?'Lager dan normaal: goed hersteld.':'Lager dan normaal: je lichaam staat onder spanning.');
function factor(naam,b,u,lower,kort){const pos=x=>Math.max(0,Math.min(100,(x-b.min)/(b.max-b.min)*100)),r=Math.round;
  return`<span class="hf"><span class="hft"><b>${naam}</b><span class="num">${r(b.value)} ${u}</span></span><span class="gl">Normaal ${r(b.low)}–${r(b.high)} ${u}</span>
  <span class="hb" role="img" aria-label="${naam} ${r(b.value)} ${u}, normaal ${r(b.low)} tot ${r(b.high)}"><i class="hbn" style="left:${pos(b.low)}%;width:${pos(b.high)-pos(b.low)}%"></i><i class="hbv${b.bad?' uit':''}" style="left:${pos(b.value)}%"></i></span>
  ${!kort||b.bad?`<span class="gl">${stateTxt(b,lower)}</span>`:''}</span>`}
function sleepF(s,kort){return`<span class="hf"><span class="hft"><b>Slaap</b><span class="num">${fmtH(s.last)}</span></span><span class="gl">7 nachten ${fmtH(s.week)} gemiddeld, doel ${fmtH(s.need)}</span>
  ${!kort||s.bad?`<span class="gl">${s.bad?'Je slaapt deze week minder dan 90% van je doel.':'Je slaapt deze week genoeg.'}</span>`:''}</span>`}
function herstelHead(h){const[lab,c,adv]=STAND[h.stand];return`<span class="hct"><span><span class="tn"><i class="dot" style="background:var(--herst)"></i>Herstel vandaag</span>
  <span class="hl"><i class="dot" style="background:${c}"></i>${lab}</span></span><span class="hs num" aria-label="Herstelscore ${h.score} van 100">${h.score}</span></span><span class="hadv">${adv}</span>`}
function herstelTile(){const h=herstel();return`<button class="card tap tile herst" data-open="herstel">${herstelHead(h)}
  ${factor('HRV, 7 dagen',h.hrv,'ms',false,true)}${factor('Rusthartslag, 7 dagen',h.rhr,'bpm',true,true)}${sleepF(h.sleep,true)}</button>`}
function renderHerstel(){const h=herstel(),f=h.fit,W=320,H=140,tr=h.trend,all=tr.flatMap(p=>[p.v,p.lo,p.hi]),lo=Math.min(...all)*.95,hi=Math.max(...all)*1.05;
  const x=i=>i/(tr.length-1)*W,y=v=>H-(v-lo)/(hi-lo)*H,line=tr.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
  const area=tr.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.hi).toFixed(1)}`).join(' ')+' '+tr.map((p,i)=>[i,p]).reverse().map(([i,p])=>`L${x(i).toFixed(1)} ${y(p.lo).toFixed(1)}`).join(' ')+'Z';
  const zn=['Herstel','Basis','Tempo','Drempel','Maximaal'];
  $('#v-detail').innerHTML=`<div class="back"><button class="ib" data-act="back" aria-label="Terug">${I.back}</button><div><h2>Herstel en fitheid</h2></div></div>
  <div class="pad stack"><div class="card herst">${herstelHead(h)}${factor('HRV, 7 dagen',h.hrv,'ms',false,false)}${factor('Rusthartslag, 7 dagen',h.rhr,'bpm',true,false)}${sleepF(h.sleep,false)}</div>
  ${bodyCard('herstel')}<div class="card"><h3>HRV, laatste 30 dagen</h3><span class="gl">Lijn: je 7-daagse gemiddelde. Band: je normale bereik.</span>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="HRV over 30 dagen met je normale bereik"><path d="${area}" fill="color-mix(in srgb,var(--herst) 30%,transparent)"/><path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(tr.length-1)}" cy="${y(tr[tr.length-1].v)}" r="4" fill="var(--ink)"/></svg></div>
  <div class="card"><h3>Fitheid</h3>${f.hrmax==null?`<span class="gl">Vul je geboortedatum in bij Profiel. Dan berekenen we je maximale hartslag, je hartslagzones en een schatting van je VO2max.</span>`:`
  <div class="st"><div><small>Max. hartslag (geschat)</small><b>${f.hrmax} bpm</b></div><div><small>Rusthartslag, 7 dagen</small><b>${Math.round(f.rhr7)} bpm</b></div>
  <div><small>VO2max van je horloge</small><b>${nl(f.vo2,1)} ml/kg/min</b></div><div><small>VO2max (schatting)</small><b>${nl(f.est,1)} ml/kg/min</b></div></div>
  <b style="margin-top:4px">Hartslagzones</b>${f.zones.map(([z,a,b])=>`<span class="tm" style="font-size:15px;color:var(--ink)"><span>Zone ${z} · ${zn[z-1]}</span><span class="num">${a}–${b} bpm</span></span>`).join('')}
  ${S.prof.sex==null||S.prof.sex==='other'?'<span class="gl">Geslacht niet ingevuld: de VO2max-schatting gebruikt de middelste factor (15).</span>':''}`}</div>
  <div class="card"><details class="uk"><summary>Hoe berekenen we dit?</summary>
  <p style="margin:0">Herstel volgt de methode die sportwetenschappers gebruiken om herstel te volgen met HRV. Je HRV (RMSSD, gemeten tijdens je slaap) wordt logaritmisch omgerekend en over 7 dagen gemiddeld; één losse nacht zegt weinig. Dat gemiddelde zetten we tegen je eigen basislijn van de 60 dagen ervoor. Je normale bereik is die basislijn plus en min de kleinste zinvolle verandering (een halve standaardafwijking). Je rusthartslag volgen we op dezelfde manier.</p>
  <p style="margin:0">De score van 0 tot 100 telt HRV voor de helft, rusthartslag en slaap elk voor een kwart. Die weging is onze keuze; het oordeel (goed, let op, rustig aan) komt uit de banden. Na 14 dagen meten is er een eerste basislijn, na 60 dagen een volledige.</p>
  <p style="margin:0">Maximale hartslag: 208 − 0,7 × leeftijd (Tanaka). Hartslagzones: 50–60, 60–70, 70–80, 80–90 en 90–100% daarvan. VO2max-schatting: factor × maximale hartslag ÷ rusthartslag (Uth), met factor 15,3 voor mannen en 14,5 voor vrouwen. De schatting is ontwikkeld bij getrainde volwassenen; een waarde van je horloge of een inspanningstest is nauwkeuriger.</p>
  <span class="gl">Bronnen: Plews e.a. (2012, 2013, 2014); Australian Institute of Sport, richtlijn HRV; Tanaka e.a. (2001); Uth e.a. (2004, 2005).</span></details><span class="gl">Geen medisch advies.</span></div></div>`}
function renderDetail(){
  if(detail==='herstel')return renderHerstel();
  if(detail==='wform')return renderWorkoutForm();
  if(detail==='wimport')return renderWorkoutImport();
  if(String(detail).startsWith('w:'))return renderWorkout(detail.slice(2));
  const id=detail,m=MI[id],a=series(id),shown=a.slice(N-period),prev=a.slice(N-2*period,N-period);if(sel==null||sel>=period)sel=period-1;
  const ch=prev.length&&mean(prev)?(mean(shown)-mean(prev))/mean(prev)*100:null,good=m.lo?ch<0:ch>0,sum=m.agg==='sum';
  $('#v-detail').innerHTML=`<div class="back"><button class="ib" data-act="back" aria-label="Terug">${I.back}</button><div><h2>${m.n}</h2><span style="color:${col(id)};font-weight:500;font-size:14px">${CAT[m.cat]}</span></div></div>
  <div class="pills">${[[7,'7 dagen'],[30,'30 dagen'],[90,'90 dagen'],[365,'Jaar']].map(([d,l])=>`<button class="pill" data-per="${d}" aria-pressed="${d===period}">${l}</button>`).join('')}</div>
  <div class="pad stack"><div class="card"><span class="big"><span class="num" style="font-size:36px">${fmt(id,shown[sel])}</span>${unit(id)?`<small>${unit(id)}</small>`:''}</span>
  <span class="gl">${dd(N-period+sel).toLocaleDateString(NL,{weekday:'long',day:'numeric',month:'long',year:'numeric'})} · ${SRC[id]}</span>
  <div class="fig" style="height:260px"><svg id="dfig"></svg></div></div>
  <div class="card"><div class="st" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Gemiddelde</small><b>${fmt(id,mean(shown))}</b></div><div><small>Laagste</small><b>${fmt(id,Math.min(...shown))}</b></div><div><small>Hoogste</small><b>${fmt(id,Math.max(...shown))}</b></div></div>
  ${ch==null?'':`<span class="tm" style="font-size:14px"><span>Vergeleken met de periode ervoor</span><b class="${Math.abs(ch)<1?'':good?'up':'dn'}" style="font-size:16px">${ch>=0?'+':'−'}${nl(Math.abs(ch),1)}%</b></span>`}
  ${sum?`<span class="gl">Totaal in deze periode: ${compact(shown.reduce((x,y)=>x+y,0))} ${unit(id)}</span>`:''}</div>${bodyCard(id)}</div>`;
  drawChart($('#dfig'),shown.map((v,i)=>({d:dd(N-period+i),v})),{bars:sum,goal:goal(id),color:col(id),sel,axis:v=>id==='sleep'?Math.round(v)+'u':compact(v),onSel:i=>{sel=i;renderDetail()}});
}

const BODY={"steps": ["Stappen telt hoeveel stappen je per dag zet. Je telefoon of horloge meet dat aan de bewegingen van je lichaam.", "Lopen is de makkelijkste manier om in beweging te blijven. Het houdt je hart, bloedvaten, spieren en botten sterk, helpt je lichaam suiker uit je bloed op te nemen en geeft je hoofd rust.", "Elke stap telt. Onderzoek laat zien dat het gezondheidsvoordeel groeit tot ongeveer 8.000 tot 10.000 stappen per dag; vanaf 60 jaar al bij 6.000 tot 8.000. Wie nu weinig loopt, heeft het meeste aan een paar duizend stappen extra."], "active": ["Actieve minuten zijn de minuten waarin je zo beweegt dat je hartslag en ademhaling omhoog gaan: stevig wandelen, fietsen, sporten.", "Daarvan wordt je hart sterker en je conditie beter. Je bloeddruk daalt, je slaapt beter, je voelt je fitter en je hebt minder kans op hart- en vaatziekten en diabetes type 2.", "De Beweegrichtlijn (Gezondheidsraad) is minstens 150 minuten per week matig intensief bewegen, verspreid over meerdere dagen. Dat is ruim 20 minuten per dag. Doe daarnaast twee keer per week iets voor je spieren en botten, zoals krachttraining of traplopen."], "dist": ["Afstand is hoeveel kilometer je lopend of rennend aflegt.", "Net als stappen zegt het hoeveel je beweegt. Meer afstand op een rustig tempo bouwt je uithoudingsvermogen op: je hart, longen en spieren leren zuurstof beter te gebruiken.", "Wil je meer gaan lopen of hardlopen? Voer de afstand rustig op, ongeveer 10 procent per week, zodat spieren en pezen kunnen meegroeien."], "kcal": ["Actieve calorieën is de energie die je verbruikt door te bewegen, bovenop wat je lichaam in rust al verbruikt.", "Je lichaam haalt die energie uit koolhydraten en vet. Hoe meer en hoe zwaarder je beweegt, hoe meer je verbruikt.", "Het is een schatting van je horloge of telefoon en kan flink afwijken. Gebruik het om dagen met elkaar te vergelijken, niet als exact getal."], "floors": ["Verdiepingen telt hoeveel trappen je omhoog loopt. Eén verdieping is ongeveer 3 meter hoogte.", "Traplopen is een korte, stevige inspanning. Het traint je beenspieren en je conditie, en telt mee als spier- en botversterkende beweging."], "rhr": ["Je rusthartslag is hoe vaak je hart per minuut klopt als je helemaal stil ligt, meestal gemeten tijdens je slaap.", "Een getraind hart pompt per slag meer bloed rond en hoeft daarom minder vaak te kloppen. Een lagere rusthartslag past dus vaak bij een betere conditie.", "Bij volwassenen ligt de rusthartslag meestal tussen 60 en 100 slagen per minuut; bij sporters vaak lager, soms rond de 40 tot 60. Ligt hij een paar dagen hoger dan je gewend bent, dan kan dat komen door vermoeidheid, stress, alcohol, slecht slapen of een opkomende verkoudheid. Heb je klachten zoals duizeligheid of hartkloppingen, ga dan naar je huisarts."], "hrv": ["HRV (hartslagvariabiliteit) is het verschil in tijd tussen twee hartslagen. Je hart klopt niet als een klok: de tijd tussen slagen wisselt steeds een beetje.", "Die wisseling komt van je zenuwstelsel. Als je lichaam ontspannen is en herstelt, is de variatie groter. Bij stress, ziekte, alcohol, weinig slaap of een zware training wordt hij kleiner.", "HRV is heel persoonlijk en daalt met de leeftijd. Vergelijk hem daarom alleen met je eigen normaal, niet met anderen. Dat doet de tegel Herstel vandaag voor je."], "spo2": ["Zuurstof (SpO2) laat zien hoeveel procent van je rode bloedcellen zuurstof bij zich heeft.", "Rode bloedcellen brengen zuurstof van je longen naar je spieren en organen. Zonder genoeg zuurstof werken ze minder goed.", "Bij gezonde mensen ligt het meestal tussen 95 en 100 procent. Horloges meten minder nauwkeurig dan een meter bij de dokter. Ben je benauwd of blijft de waarde laag, neem dan contact op met je huisarts."], "resp": ["Ademhaling telt hoe vaak je per minuut in- en uitademt, gemeten tijdens je slaap.", "Rustig ademen hoort bij een lichaam dat ontspannen is en herstelt.", "Bij volwassenen in rust is 12 tot 20 keer per minuut gewoon. Een plotselinge stijging kan passen bij koorts, ziekte of stress."], "sleep": ["Slaapduur is hoe lang je echt slaapt, zonder de tijd dat je wakker in bed ligt.", "Tijdens je slaap herstellen je spieren, slaat je brein herinneringen op, ruimt het afvalstoffen op en regelt je lichaam je hormonen en afweer. Wie te kort slaapt, heeft minder energie, meer trek en wordt vaker ziek.", "Volwassenen hebben meestal 7 tot 9 uur nodig, vanaf 65 jaar 7 tot 8 uur. Vaste tijden om naar bed te gaan en op te staan helpen het meest."], "sscore": ["De slaapscore is een cijfer van je horloge dat samenvat hoe goed je sliep: hoe lang, hoe diep en hoe onrustig.", "Elk merk rekent het op een eigen manier uit. Kijk daarom vooral naar je eigen verloop: gaat het omhoog of omlaag?"], "stress": ["Stress is een score van je horloge, berekend uit je hartslag en HRV overdag. Hoe hoger, hoe meer je lichaam 'aan' staat.", "Korte stress is normaal en zelfs nuttig, bijvoorbeeld tijdens sporten. Blijft het lang hoog, dan krijgt je lichaam te weinig tijd om te herstellen.", "Een korte wandeling, rustig ademen of even niets doen helpt om de score omlaag te krijgen."], "energy": ["Energieniveau (Body Battery van Garmin) schat hoeveel energie je lichaam nog heeft.", "Het laadt op als je slaapt en rust, en loopt leeg door beweging, stress en drukte. Zie het als een batterij die je zelf kunt bijladen."], "recov": ["Hersteltijd is het advies van je horloge hoeveel uur je na een training nodig hebt voordat je weer zwaar traint.", "Na een zware training heeft je lichaam tijd nodig om spieren te herstellen en sterker terug te komen. Rustig bewegen mag in die tijd wel; dat helpt het herstel zelfs."], "vo2": ["VO2max is de hoeveelheid zuurstof die je lichaam per minuut per kilo kan gebruiken als je alles geeft. Het is de beste maat voor je conditie.", "Hoe hoger je VO2max, hoe beter je hart, longen en spieren samenwerken. Een goede conditie hangt samen met een langer en gezonder leven.", "Je kunt je VO2max verbeteren met duurtraining (lang en rustig) en intervaltraining (kort en zwaar). Wat goed is, hangt af van je leeftijd en geslacht; na je 30e daalt hij langzaam, maar trainen remt dat."], "weight": ["Gewicht is je lichaamsgewicht in kilo's.", "Je gewicht schommelt per dag makkelijk een tot twee kilo door vocht, eten en wc-bezoek. Kijk daarom naar het verloop over weken, niet naar één dag.", "Weeg jezelf voor een eerlijk beeld steeds op hetzelfde moment, bijvoorbeeld 's ochtends na het opstaan."], "herstel": ["Herstel vandaag laat zien hoe goed je lichaam is bijgekomen van inspanning, stress en de dag ervoor.", "Als je HRV hoger is en je rusthartslag lager dan je gewend bent, is je lichaam in de herstelstand. Dan kan het een stevige training aan. Zijn ze andersom, dan is je lichaam nog bezig met herstellen, of met iets anders zoals een verkoudheid of stress.", "Luister naar je lichaam: de score is een hulpmiddel, geen opdracht."], "load": ["Trainingsbelasting zegt hoe zwaar een training voor je lichaam was. Een uur rustig wandelen telt weinig, een uur hard rennen telt veel.", "Je lichaam wordt sterker in de rust na een training. Train je een tijd meer dan je gewend bent, dan word je fitter, maar heb je ook meer rust nodig. Wordt het te veel ineens, dan neemt de kans op blessures en ziek worden toe.", "'Deze week' is je belasting van de laatste dagen, 'gewend' die van de laatste zes weken. Vorm is het verschil: positief betekent uitgerust, negatief betekent dat je meer doet dan je gewend bent."]};
const SPORT_INFO={"running": "Hardlopen traint je hart en longen sterk en maakt je botten steviger. Begin rustig en bouw langzaam op, zodat pezen en gewrichten mee kunnen groeien.", "walking": "Wandelen is zacht voor je gewrichten en goed voor je hart, je bloedsuiker en je humeur. Stevig doorwandelen telt als matig intensief bewegen.", "hiking": "Een wandeltocht, zeker met hoogteverschil, traint je benen, je conditie en je balans.", "cycling": "Fietsen traint je hart, longen en beenspieren en is licht voor je gewrichten.", "swimming": "Zwemmen gebruikt bijna al je spieren en is heel licht voor je gewrichten. Goed voor je conditie en je ademhaling.", "strength": "Krachttraining maakt je spieren en botten sterker, helpt je stofwisseling en voorkomt blessures. De Beweegrichtlijn raadt het minstens twee keer per week aan.", "hiit": "Intervaltraining wisselt korte, zware stukken af met rust. In korte tijd verbetert het je conditie en je VO2max flink.", "yoga": "Yoga en pilates maken je soepeler en sterker in je romp, verbeteren je balans en helpen je ontspannen.", "rowing": "Roeien en peddelen trainen je hele lichaam: benen, rug, armen en je conditie tegelijk.", "elliptical": "De crosstrainer en traplopen geven een stevige conditietraining die licht is voor je knieën.", "team": "Teamsport combineert sprinten, draaien en samenspelen: goed voor je conditie, je reactievermogen en je humeur.", "racket": "Racketsporten trainen je conditie, je snelheid en je oog-handcoördinatie.", "dance": "Dansen traint je conditie, je coördinatie en je geheugen, en is vooral leuk.", "martial": "Vechtsporten trainen kracht, conditie, snelheid en concentratie.", "winter": "Wintersport traint je benen, je balans en je conditie.", "other": "Elke beweging telt. Wie regelmatig beweegt, slaapt beter, voelt zich fitter en blijft langer gezond."};

// ---------- Training (zelfde opzet als de app: Workouts.kt, WorkoutFiles.kt, functie training() op de server) ----------
const SPORTS=[['running','Hardlopen'],['walking','Wandelen'],['hiking','Wandeltocht'],['cycling','Fietsen'],['swimming','Zwemmen'],['strength','Krachttraining'],['hiit','Intervaltraining'],['yoga','Yoga en pilates'],['rowing','Roeien en peddelen'],['elliptical','Crosstrainer en traplopen'],['team','Teamsport'],['racket','Racketsport'],['dance','Dansen'],['martial','Vechtsport'],['winter','Wintersport'],['other','Overig']];
const SPORTN=Object.fromEntries(SPORTS),SPORTK=new Set(SPORTS.map(s=>s[0]));
const bodyCard=id=>BODY[id]?`<div class="card"><details class="uk"><summary>${id==='load'?'Wat betekent dit voor je lichaam?':'Wat zegt dit over je lichaam?'}</summary>${BODY[id].map(p=>`<p>${p}</p>`).join('')}${id==='load'?'':'<span class="gl">Geen medisch advies. Twijfel je, vraag het je huisarts.</span>'}</details></div>`:'';
// Voorbeeldtrainingen van de laatste 120 dagen (vast patroon, zodat de preview steeds hetzelfde laat zien)
const SAMPLE_WK=(()=>{const out=[];let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
  for(let i=0;i<120;i++){const d=new Date(NOW.getTime()-i*DAY),wd=d.getDay();let sp=null;
    if(wd===1||wd===3)sp='running';else if(wd===6)sp=i%14<7?'running':'cycling';else if(wd===2)sp='strength';else if(wd===0)sp='cycling';else if(wd===4&&i%2)sp='yoga';
    if(!sp)continue;const dur={running:2400+r()*1500,cycling:3600+r()*2400,strength:2700,yoga:1800}[sp]|0;
    const hr={running:142+r()*14,cycling:128+r()*12,strength:112+r()*10,yoga:92+r()*8}[sp]|0;
    const start=new Date(d);start.setHours(sp==='yoga'?20:7,15,0,0);
    out.push({id:'s'+i,source:sp==='cycling'?'google_health':sp==='running'&&wd===6?'file':'health_connect',sport:sp,title:sp==='running'&&wd===6?'Lange duurloop':null,
      day:start.toISOString().slice(0,10),start:start.getTime(),dur,dist:sp==='running'?dur/330*1000|0:sp==='cycling'?dur/150*1000|0:null,kcal:Math.round(dur/60*(sp==='yoga'?4:sp==='strength'?7:11)),
      avg:hr,max:hr+18,asc:sp==='cycling'?Math.round(r()*300):null,notes:null,origin:sp==='cycling'?'Google Health':sp==='running'&&wd===6?'FIT-bestand':'Google Fit'})}
  return out})();
const allWk=()=>[...S.wk,...SAMPLE_WK].sort((a,b)=>b.start-a.start);
function trimpOf(w,rest,max){if(w.avg==null||rest==null||max==null||max-rest<20)return null;const x=Math.max(0,Math.min(1,(w.avg-rest)/(max-rest))),m=w.dur/60,sx=S.prof.sex;
  return Math.round(10*(sx==='male'?m*x*.64*Math.exp(1.92*x):sx==='female'?m*x*.86*Math.exp(1.67*x):m*x*(.64*Math.exp(1.92*x)+.86*Math.exp(1.67*x))/2))/10}
function trainingSummary(){const birth=S.prof.birth?new Date(S.prof.birth):null,age=birth?Math.floor((NOW-birth)/31557600000):null,max=age!=null?Math.round(208-.7*age):null;
  const rest=mean(series('rhr').slice(N-30)),list=allWk().map(w=>({...w,load:trimpOf(w,rest,max)}));
  const t0=new Date(NOW);t0.setHours(0,0,0,0);const dayIdx=w=>Math.round((t0-new Date(w.day+'T00:00:00'))/DAY);
  const wk=list.filter(w=>dayIdx(w)<7),loads=new Array(180).fill(0);list.forEach(w=>{const i=dayIdx(w);if(i>=0&&i<180&&w.load)loads[179-i]+=w.load});
  let atl=0,ctl=0;const ready=list.some(w=>w.load!=null);if(ready)for(const l of loads){atl+=(l-atl)*(1-Math.exp(-1/7));ctl+=(l-ctl)*(1-Math.exp(-1/42))}
  const mon=new Date(t0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const weeks=[...Array(8)].map((_,k)=>{const a=new Date(mon);a.setDate(a.getDate()-7*(7-k));const b=new Date(a);b.setDate(b.getDate()+7);
    const ws=list.filter(w=>{const d=new Date(w.day+'T00:00:00');return d>=a&&d<b});return{week:a,min:Math.round(ws.reduce((x,w)=>x+w.dur,0)/60)}});
  return{list,max,rest,week:{n:wk.length,min:Math.round(wk.reduce((x,w)=>x+w.dur,0)/60),km:wk.reduce((x,w)=>x+(w.dist||0),0)/1000},weeks,
    load:{ready:ready&&max!=null,acute:atl,chronic:ctl,form:ctl-atl,days:ready?Math.min(180,Math.max(...list.filter(w=>w.load!=null).map(dayIdx))+1):0}}}
const fmtDur=s=>{const m=Math.round(s/60);return m<60?`${m} min`:`${Math.floor(m/60)}u ${String(m%60).padStart(2,'0')}m`};
const fmtKm=m=>`${nl(m/1000,m>=10000?0:1)} km`;
function fmtPace(w){const d=w.dist;if(!d||d<100)return null;if(['running','walking','hiking'].includes(w.sport)){const s=w.dur/(d/1000);return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')} /km`}
  if(w.sport==='cycling')return`${nl(d/1000/(w.dur/3600),1)} km/u`;if(w.sport==='swimming'){const s=w.dur/(d/100);return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')} /100 m`}return null}
const srcLabel=w=>w.source==='health_connect'?'Health Connect · '+(w.origin||'app'):w.source==='google_health'?'Google Health':w.source==='manual'?'Zelf gelogd':(w.origin||'Bestand');
function dayLabel(day){const d=new Date(day+'T00:00:00'),t=new Date(NOW);t.setHours(0,0,0,0);const n=Math.round((t-d)/DAY);
  if(n===0)return'Vandaag';if(n===1)return'Gisteren';const s=d.toLocaleDateString(NL,{weekday:'long',day:'numeric',month:'long',...(d.getFullYear()!==t.getFullYear()?{year:'numeric'}:{})});return s[0].toUpperCase()+s.slice(1)}
const vormOf=f=>f>5?['Uitgerust','Je hebt de laatste dagen minder getraind dan je gewend bent. Goed voor een wedstrijd of een stevige training.']:f>=-10?['In balans','Je traint ongeveer zoveel als je gewend bent.']:f>=-30?['Flink aan het trainen','Je traint meer dan je gewend bent. Zo word je fitter, als je ook genoeg rust neemt.']:['Zwaar belast','Je traint veel meer dan je gewend bent. Plan een paar rustige dagen om blessures te voorkomen.'];
function wkRow(w,click=true){const t=new Date(w.start).toLocaleTimeString(NL,{hour:'2-digit',minute:'2-digit'}),facts=[w.dist?fmtKm(w.dist):null,fmtPace(w),w.avg?'♥ '+w.avg:null,w.kcal!=null?w.kcal+' kcal':null,w.load!=null?'belasting '+Math.round(w.load):null].filter(Boolean);
  return`<${click?`button class="card tap wk" data-wk="${esc(w.id)}"`:'div class="card wk"'}><span class="wkh"><i class="dot" style="background:var(--act)"></i><span class="wkt"><b>${esc(w.title||SPORTN[w.sport])}</b><span class="gl">${[t,w.title?SPORTN[w.sport]:null,esc(srcLabel(w))].filter(Boolean).join(' · ')}</span></span><b class="num">${fmtDur(w.dur)}</b></span>${facts.length?`<span class="num wkf">${facts.join('&nbsp;&nbsp; ')}</span>`:''}</${click?'button':'div'}>`}
function renderTraining(){const T=trainingSummary(),L=T.load,mx=Math.max(30,...T.weeks.map(w=>w.min)),by={};T.list.forEach(w=>(by[w.day]=by[w.day]||[]).push(w));
  const v=L.ready?vormOf(L.form):null;
  $('#v-training').innerHTML=`<div class="pad"><div class="sh" style="margin-top:16px"><div><h1 style="margin:0">Training</h1><p class="mut" style="margin:2px 0 0">Je trainingen uit al je bronnen, en wat ze met je lichaam doen</p></div></div>

  <div class="st" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><small>Deze week</small><b>${Math.round(L.acute)}</b></div><div><small>Gewend</small><b>${Math.round(L.chronic)}</b></div><div><small>Vorm</small><b>${L.form>0?'+':''}${Math.round(L.form)}</b></div></div>
  ${L.days<42?`<span class="gl">Na 6 weken trainen is dit betrouwbaar; nu ${L.days} dagen.</span>`:''}`:`<span>${T.max==null?'Vul je geboortedatum in bij Profiel. Dan rekenen we uit hoe zwaar je trainingen voor je lichaam zijn.':'Belasting rekenen we uit je gemiddelde hartslag per training.'}</span>`}

function renderWorkout(id){const T=trainingSummary(),w=T.list.find(x=>x.id===id);if(!w){detail=null;show();return}

/* Kop die altijd past (zoals FitText in de app): eerst één regel tot 72%, dan twee regels (naam eronder) van 80% tot 60% */
function fitHeads(){for(const el of document.querySelectorAll('.fit')){
  const base=parseFloat(getComputedStyle(document.documentElement).fontSize)/16*30,fits=()=>el.scrollWidth<=el.clientWidth+1;
  el.classList.remove('two','three');let s;
  for(s=1;s>=.72-1e-3;s-=.04){el.style.fontSize=base*s+'px';if(fits())break}
  if(s>=.72-1e-3)continue;
  el.classList.add('two');const lines=[...el.childNodes].map(n=>n.textContent.trim());
  const c=document.createElement('canvas').getContext('2d'),w=el.clientWidth,f=getComputedStyle(el);
  for(s=.8;s>.6;s-=.04){c.font=`${f.fontWeight} ${base*s}px ${f.fontFamily}`;if(lines.every(t=>c.measureText(t).width<=w))break}
  if(s<=.6){s=.6;el.classList.add('three')}
  el.style.fontSize=base*s+'px'}}
addEventListener('resize',()=>fitHeads());

    setTimeout(()=>{syncedAt=new Date();refreshing='done';renderToday();rr();if(S.nGoals&&today('steps')>=goal('steps'))notify('Doel gehaald: stappen',`${fmt('steps',today('steps'))} stappen vandaag. Mooi werk!`);

  document.body.appendChild(el);el.querySelector('[data-ok]').focus()}
function closeDisc(){const e=document.getElementById('disc');if(e)e.remove()}
function checkProf(){const okH=draft.h==null||(draft.h>=50&&draft.h<=260),okW=draft.w==null||(draft.w>=20&&draft.w<=400);if(!okH||!okW){$('#pnote').textContent='Vul een lengte tussen 50 en 260 cm en een gewicht tussen 20 en 400 kg in.'}return okH&&okW}
function setProf(t){const k=t.dataset.prof;let v=t.value;if(k==='h'||k==='w'){v=parseFloat(String(v).replace(',','.'));v=isFinite(v)?v:null}else if(k==='birth')v=v||null;draft[k]=v;
  const b=document.querySelector('[data-act=psave]');if(b)b.disabled=JSON.stringify(draft)===JSON.stringify(S.prof);const n=$('#pnote');if(n){n.textContent='';n.style.color=''}}
// Swipen tussen Vandaag, Gezondheid en Slaap (zoals in de app); niet vanuit een grafiek of invulveld
{let sx=null,sy=0,st=0;const TABS=['today','health','sleep','training'];
  document.addEventListener('touchstart',e=>{const t=e.touches[0];if(e.touches.length!==1||editing||detail||settings||S.onb||e.target.closest('.fig,input,.pills')){sx=null;return}sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
  document.addEventListener('touchend',e=>{if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;sx=null;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5||Date.now()-st>800)return;
    const i=TABS.indexOf(tab),j=i+(dx<0?1:-1);if(j<0||j>=TABS.length)return;
    tab=TABS[j];show();const v=$('#v-'+tab);v.classList.remove('in-l','in-r');void v.offsetWidth;v.classList.add(dx<0?'in-r':'in-l')},{passive:true})}
renderAll();show();
}
</script>
<script>setTimeout(()=>{const s=document.getElementById('splash');if(!s)return;s.classList.add('out');setTimeout(()=>s.remove(),400)},1200)</script>
